---
stages:
  - install
  - build
  - generate
  - sync
  - publish

variables:
  NODE_VERSION: 24-alpine

include:
  - project: devops/pipelines
    ref: references@1.5.0
    file: /references/workflow.gitlab-ci.yml

  - project: devops/pipelines
    ref: node@2.2.2
    file:
      - /node/install.gitlab-ci.yml
      - /node/build.gitlab-ci.yml
      - /node/lint.gitlab-ci.yml
      - /node/run.gitlab-ci.yml

  - project: devops/pipelines
    ref: git@1.1.4
    file:
      - /git/sync.gitlab-ci.yml

  - project: devops/pipelines
    ref: semantic-release@3.0.0
    file:
      - /semantic-release/publish.gitlab-ci.yml

install:
  stage: install
  extends: .node-install

lint:
  stage: build
  extends: .node-lint

build:
  stage: build
  extends: .node-build
  artifacts:
    paths:
      - dist/**
      - oclif.manifest.json

typecheck:
  stage: build
  extends: .node-run
  variables:
    NODE_COMMAND_SCRIPT: typecheck

test:
  stage: build
  extends: .node-run
  variables:
    NODE_COMMAND_SCRIPT: test

generate:
  extends: .node-run
  stage: generate
  variables:
    NODE_COMMAND_SCRIPT: start
  artifacts:
    paths:
      - default.json

git-sync:
  stage: sync
  extends: .git-sync
  needs:
    - generate
    - lint
  variables:
    GIT_SYNC_PATHS: |
      - source: default.json
        destination: default.json

semantic-release:
  stage: publish
  extends:
    - .semantic-release
  dependencies: []
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^(master|main|alpha|beta|rc|next)$/'
      interruptible: false
    - when: never
